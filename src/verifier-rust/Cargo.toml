[package]
name = "collatz-verify-unit"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rug = { version = "1.30.0", default-features = false, features = ["integer"] }
serde_json = { version = "1.0.149", features = ["std"] }
sha2 = "0.10.9"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
